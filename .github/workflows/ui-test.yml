name: Android camera journey
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: bash scripts/setup-android-ci.sh
      - name: Install emulator
        run: |
          android --no-metrics sdk install platform-tools emulator system-images/android-36/google_apis/x86_64
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Start dedicated test device
        run: bash scripts/start-ui-emulator.sh
      - name: Record, export, change settings, capture screenshots
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Collect screenshots and device log
        if: always()
        run: |
          mkdir -p ui-artifacts
          "$ANDROID_HOME/platform-tools/adb" pull /sdcard/Android/data/com.sasakiy84.solovlog/files/screenshots ui-artifacts/ || true
          "$ANDROID_HOME/platform-tools/adb" logcat -d -t 2000 > ui-artifacts/logcat.txt || true
          cp "$RUNNER_TEMP/emulator.log" ui-artifacts/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: daylog-ui-verification
          path: |
            ui-artifacts/
            app/build/reports/androidTests/
          if-no-files-found: error
