name: Android release
run-name: Release ${{ inputs.version || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.2.3)'
        required: true
        type: string
      publish:
        description: 'Publish GitHub Release (disable to verify signing only)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version and release target
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: bash scripts/setup-android-ci.sh
      - name: Restore signing key
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE" || { echo 'Missing ANDROID_RELEASE_KEYSTORE secret'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/solo-vlog-release.jks"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/solo-vlog-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon :app:assembleRelease "-PreleaseVersion=$RELEASE_VERSION"
      - name: Verify signature and prepare release files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/solo-vlog-$RELEASE_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          python3 scripts/verify-apk.py "$apk" "$RELEASE_VERSION"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > dist/apk-metadata.txt
          (cd dist && sha256sum "solo-vlog-$RELEASE_VERSION.apk" > SHA256SUMS)
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solo-vlog-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS dist/apk-metadata.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "daylog $RELEASE_TAG" \
            --notes 'Android 16 以上向けの署名付き APK です。APK をダウンロードしてインストールしてください。' --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/solo-vlog-release.jks"
